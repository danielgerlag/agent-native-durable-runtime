[package]
name = "durable_session"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Agent-native durable session runtime"
publish = false

[dependencies]
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
